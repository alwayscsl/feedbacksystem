<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Feedback System - Create Account</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="login-page">
    <!-- Header -->
    <header class="header-bar">
      <div class="logo">Feedback System</div>
    </header>

    <!-- Create Account -->
    <main class="login-container">
      <!-- Image (decorative) -->
      <div class="image-section">
        <img src="desk_girl1.png" alt="" />
      </div>

      <!-- Form Section -->
      <section class="login-section">
        <div class="login-content">
          <div class="welcome-header">
            <h1>Create Your Account</h1>
            <p>Enter your information to get started.</p>
          </div>

          <div class="card login-card">
            <form id="create-account-form" action="index.html" method="post">
              <!-- First and last name side by side -->
              <div class="form-row">
                <div class="form-group">
                  <label for="first-name">First Name</label>

                  <input
                    type="text"
                    id="first-name"
                    name="first-name"
                    autocomplete="given-name"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="last-name">Last Name</label>

                  <input
                    type="text"
                    id="last-name"
                    name="last-name"
                    autocomplete="family-name"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="email">School Email</label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="name@student.ntc.edu"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="student-id">Student ID</label>

                <input
                  type="text"
                  id="student-id"
                  name="student-id"
                  inputmode="numeric"
                  autocomplete="off"
                  required
                />
              </div>

              <div class="form-group">
                <label for="password">Password</label>

                <input
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="new-password"
                  minlength="8"
                  aria-describedby="password-hint"
                  required
                />

                <p id="password-hint" class="form-hint">Use at least 8 characters.</p>
              </div>

              <div class="form-group">
                <label for="confirm-password">Confirm Password</label>

                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  autocomplete="new-password"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary btn-block">Create Account</button>

              <p id="create-message" class="form-message" role="status" hidden></p>

              <div class="form-link">
                <a href="index.html">Already have an account? Log in</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer-bar">
      <p>&copy; 2026 Feedback System &middot; Northcentral Technical College</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
