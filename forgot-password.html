<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Feedback System - Forgot Password</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="login-page">
    <!-- Header -->
    <header class="header-bar">
      <div class="logo">Feedback System</div>
    </header>

    <!-- Forgot Password -->
    <main class="login-container">
      <!-- Image -->
      <div class="image-section">
        <img src="desk_girl1.png" alt="" />
      </div>

      <!-- Form -->
      <section class="login-section">
        <div class="login-content">
          <div class="welcome-header">
            <h1>Forgot Password?</h1>
            <p>Enter your email and we'll send you a reset link.</p>
          </div>

          <div class="card login-card">
            <form id="forgot-form" action="index.html" method="post">
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary btn-block">
                Send Reset Link
              </button>

              <p id="forgot-message" class="form-message" hidden></p>

              <div class="form-link">
                <a href="index.html">Back to Login</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer-bar">
      <p>&copy; 2026 Feedback System &middot; Northcentral Technical College</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
